{{- define "layouts/layout"}}
<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <meta name="color-scheme" content="light dark" />
   <title>Adam Presley</title>
   <link rel="preload" href="/static/css/frameui.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
   <link rel="preload" href="/static/css/styles.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
   <link rel="preload" href="/static/css/icons.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
   <noscript>
      <link type="text/css" rel="stylesheet" media="screen" href="/static/css/frameui.min.css" />
      <link type="text/css" rel="stylesheet" media="screen" href="/static/css/styles.css" />
      <link type="text/css" rel="stylesheet" media="screen" href="/static/css/icons.css" />
   </noscript>
   {{stylesheetIncludes "Stylesheets" .}}
</head>

<body>
   <header class="top-header">
      <nav>
         <ul>
            <li>
               <h1>
                  <a href="/">Adam Presley</a>
               </h1>
            </li>
         </ul>
         <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/experience">Experience</a></li>
         </ul>
      </nav>
   </header>
   <!-- END NAV -->

   <main id="mainContent" class="container">
      {{template "content" .}}
   </main>

   <footer>
      <section>
         <a href="https://github.com/adampresley" target="_blank">
            <span class="icon github medium" aria-label="Adam's Github"></span>
         </a>

         <a href="https://www.linkedin.com/in/adampresley/" target="_blank">
            <span class="icon linkedin medium" aria-label="Adam's LinkedIn"></span>
         </a>
      </section>

      <section>
         <p>&copy; 2025 Adam Presley</p>
      </section>
   </footer>

   {{javascriptIncludes "JavascriptIncludes" .}}

   <script id="aletics-script" src="https://aletics.adampresley.com/aletics/v1/tracker.js" async defer></script>
   <script>
      document.querySelector("#aletics-script").onload = () => {
         (Aletics.init("https://aletics.adampresley.com/aletics", "14019928-54a9-4103-80de-2dd95b0fec47")).track();
      };
   </script>
</body>

</html>
{{end}}
