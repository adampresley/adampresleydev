version: "0.5"

processes:
  adampresleydev:
    command: air
    namespace: http:3000
    working_dir: ./cmd/adampresleydev
    readiness_probe:
      http_get:
        host: localhost
        port: 3000
        scheme: http
        path: /heartbeat
    liveness_probe:
      http_get:
        host: localhost
        port: 3000
        scheme: http
        path: /heartbeat
